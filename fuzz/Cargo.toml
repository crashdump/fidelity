[package]
name = "fidelity-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fidelity-formats = { path = "../crates/fidelity-formats" }
fidelity-types = { path = "../crates/fidelity-types" }
libfuzzer-sys = "0.4"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "apk_zip"
path = "fuzz_targets/apk_zip.rs"
test = false
doc = false

