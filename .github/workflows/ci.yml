# The gate runs `tests/platform/run.sh`, and it states no command of its own.
#
# `docs/plan/06-delivery.md` holds the command list, and the harness runs it. A
# second copy here would drift from that one, and the copy that drifts is the
# one that decides whether a change lands.
#
# The script runs on six runners, because each one reaches controls that the
# others cannot. A runner runs its own platform natively, so the Linux runner
# reaches the Linux controls and the Windows runner reaches the Windows ones.
# A developer on a Mac reaches those same controls through the guests that
# `tests/platform/controls/vm.sh` manages, and the harness runs one command text
# either way.
#
# Linux and Windows run on both architectures here. Every detector result that
# a developer machine produces comes from ARM64, so these runners are where
# x86_64 answers for those two. `tests/platform/README.md` records what they found.
#
# macOS runs on ARM64 alone. No Intel Mac is in scope, so the gate takes no
# x86_64 macOS runner even though one exists until August 2027.
#
# No runner reaches a device or a simulator, so the harness records a `skipped`
# row for each of those with the reason. That is the point: a green run here is
# not a claim that every platform was exercised, and the log says which ones
# were not.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FIDELITY_NIGHTLY: nightly-2026-06-14

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the dependency policy tool
        run: cargo install cargo-deny --version 0.19.0 --locked

      - name: Check the workspace graph
        run: cargo deny check advisories sources

      - name: Check the Tauri graph
        run: >-
          cargo deny --manifest-path bindings/tauri-plugin-fidelity/Cargo.toml
          check advisories sources -A unmaintained

      - name: Check the fuzz graph
        run: cargo deny --manifest-path fuzz/Cargo.toml check advisories sources

  gate:
    strategy:
      # One runner must not hide the answer that the other one gives.
      fail-fast: false
      matrix:
        os:
          - macos-latest      # ARM64
          - ubuntu-latest     # x86_64
          - ubuntu-24.04-arm  # ARM64
          - windows-latest    # x86_64
          - windows-11-arm    # ARM64
    runs-on: ${{ matrix.os }}
    # The harness is one POSIX shell script, and the Windows runner defaults to
    # PowerShell. One shell for every runner keeps the gate a single script.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchains that the harness asks for
        run: |
          set -eu
          # The minimum version comes from the manifest, so this file states no
          # version of its own and the two cannot disagree.
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          rustup toolchain install "$msrv" --profile minimal
          adapter_msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' \
            bindings/tauri-plugin-fidelity/Cargo.toml | head -1)
          rustup toolchain install "$adapter_msrv" --profile minimal
          # The sanitizers build the standard library from source.
          rustup toolchain install "$FIDELITY_NIGHTLY" --profile minimal \
            --component rust-src --component miri
          # The harness states the target list, so this file holds no copy of
          # it. A target that is the host on one runner is a cross-target on
          # the other, and `rustup target add` on the host target succeeds and
          # does nothing. Both toolchains need the list, because `rustup target
          # add` works on one toolchain at a time.
          for target in $(tests/platform/run.sh --targets); do
              rustup target add "$target"
              rustup target add --toolchain "$msrv" "$target"
          done

      - name: Run the gate
        run: tests/platform/run.sh

      # The record is what the run proves, and a run that only prints it leaves
      # nothing to read afterwards. Every Linux detector control passed on an
      # x86_64 runner from 2026-08-13, and no artifact kept a single row, so
      # `tests/platform/README.md` still asked for an x86_64 machine that CI had
      # already answered for. `always()` keeps the record of a failing run too,
      # because that is the run whose rows matter most.
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-${{ matrix.os }}
          path: tests/platform/record.tsv
          if-no-files-found: error
