[package]
name = "fidelity-probe-windows"
description = "Windows operating-system access for the fidelity runtime tamper detection library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["os::windows-apis", "security"]

# The crate compiles for its own target only, so a build for any other target
# documents nothing at all.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[target.'cfg(target_os = "windows")'.dependencies]
fidelity-core.workspace = true
fidelity-types.workspace = true

[lints]
workspace = true
