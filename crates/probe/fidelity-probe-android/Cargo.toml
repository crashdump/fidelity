[package]
name = "fidelity-probe-android"
description = "Android operating-system access for the fidelity runtime tamper detection library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["os", "security"]

# The crate compiles for its own target only, so a build for any other target
# documents nothing at all.
[package.metadata.docs.rs]
default-target = "aarch64-linux-android"
targets = []

[target.'cfg(target_os = "android")'.dependencies]
fidelity-cipher.workspace = true
fidelity-core.workspace = true
fidelity-formats.workspace = true
fidelity-types.workspace = true

[lints]
workspace = true
