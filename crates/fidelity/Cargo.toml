[package]
name = "fidelity"
description = "Detect hostile changes to an application's runtime environment, and apply a host-selected response."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["security", "os"]
# These three tests read the workspace around them, so they prove a rule that
# `docs/` states about the shape of the repository. A published crate holds no
# such workspace, and the tests would fail for a reader who unpacks it.
exclude = [
    "tests/architecture.rs",
    "tests/capability_matrix.rs",
    "tests/evidence.rs",
]

# Cargo selects a probe by the target, so a page built for one target states
# what that one platform reads. The list gives the reader every platform, and
# `all-features` documents the `serde` implementations.
[package.metadata.docs.rs]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[build-dependencies]
fidelity-cipher.workspace = true

[dependencies]
fidelity-cipher.workspace = true
fidelity-core.workspace = true
fidelity-detect.workspace = true
fidelity-engine.workspace = true
fidelity-macros.workspace = true
fidelity-types.workspace = true

[features]
# Off by default, so a default build resolves to no external crate. The feature
# forwards to the data model, because that is where the public types live.
serde = ["fidelity-types/serde"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
fidelity-probe-apple.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fidelity-probe-linux.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
fidelity-probe-android.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
fidelity-probe-windows.workspace = true

[lints]
workspace = true
