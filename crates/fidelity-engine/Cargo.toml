[package]
name = "fidelity-engine"
description = "State and policy for the fidelity runtime tamper detection library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["security"]

[dependencies]
fidelity-core.workspace = true
fidelity-detect.workspace = true
fidelity-types.workspace = true
tracing = { workspace = true, optional = true }

[features]
# Off by default, so a default build resolves to no external crate. The engine
# owns the runtime work, so it owns every event. Fidelity installs no
# subscriber, and a host that wants the events selects one of its own.
tracing = ["dep:tracing"]

[dev-dependencies]
fidelity-testkit.workspace = true

[lints]
workspace = true
