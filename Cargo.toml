[workspace]
resolver = "3"
members = [
    "crates/fidelity",
    "crates/fidelity-cipher",
    "crates/fidelity-core",
    "crates/fidelity-detect",
    "crates/fidelity-engine",
    "crates/fidelity-formats",
    "crates/fidelity-macros",
    "crates/probe/fidelity-probe-android",
    "crates/probe/fidelity-probe-apple",
    "crates/probe/fidelity-probe-linux",
    "crates/probe/fidelity-probe-windows",
    "crates/fidelity-testkit",
    "crates/fidelity-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# `docs/plan/06-delivery.md` pins the MSRV to one concrete version, at or below
# the current stable release minus two. A new Rust release never raises it.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/crashdump/fidelity"
keywords = ["security", "tamper", "integrity", "debugger", "jailbreak"]

# Every internal crate states its path and its version once, here. A release
# raises the version in this one table, and no crate manifest repeats it.
# `fidelity-testkit` states no version, because it never reaches the registry.
# Cargo drops a path-only dev-dependency when it packages a crate, and that is
# what lets a published crate depend on a crate that stays unpublished.
[workspace.dependencies]
fidelity-cipher = { path = "crates/fidelity-cipher", version = "0.1.0" }
fidelity-core = { path = "crates/fidelity-core", version = "0.1.0" }
fidelity-detect = { path = "crates/fidelity-detect", version = "0.1.0" }
fidelity-engine = { path = "crates/fidelity-engine", version = "0.1.0" }
fidelity-formats = { path = "crates/fidelity-formats", version = "0.1.0" }
fidelity-macros = { path = "crates/fidelity-macros", version = "0.1.0" }
fidelity-probe-android = { path = "crates/probe/fidelity-probe-android", version = "0.1.0" }
fidelity-probe-apple = { path = "crates/probe/fidelity-probe-apple", version = "0.1.0" }
fidelity-probe-linux = { path = "crates/probe/fidelity-probe-linux", version = "0.1.0" }
fidelity-probe-windows = { path = "crates/probe/fidelity-probe-windows", version = "0.1.0" }
fidelity-testkit = { path = "crates/fidelity-testkit" }
fidelity-types = { path = "crates/fidelity-types", version = "0.1.0" }

# The two optional dependencies in the workspace, and both are off by default,
# so a default build still resolves to no external crate at all. A test in
# `crates/fidelity/tests/architecture.rs` holds that property.
#
# `docs/plan/07-state-and-budgets.md` states the `serde` feature, and the locked
# decision index in `docs/plan/README.md` settles it.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }

# `tracing` carries the diagnostics that the same index asks for under I/O.
# The default features add `tracing-attributes`, which pulls a proc-macro chain
# through `syn`, and this workspace writes no instrumented function, so the
# feature list holds `std` alone. See `docs/plan/03-runtime-and-api.md`.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
